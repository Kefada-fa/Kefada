name: Build item pages

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths-ignore:
      - 'item/**'
      - 'previews/**'

permissions:
  contents: write

concurrency:
  group: build-item-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install image tool
        run: npm install --no-save sharp
      - name: Build item pages
        run: node build-item-pages.mjs
      - name: Save changes
        run: |
          git config user.name "item-pages-bot"
          git config user.email "item-pages-bot@users.noreply.github.com"
          git add item previews
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update item pages"
            git push
          fi
